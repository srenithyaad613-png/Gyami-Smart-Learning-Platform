<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gyami | Sign Up</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="auth"><section class="card authbox"><div class="logo">Gyami<span>✦</span></div><h1>Create account</h1><p class="muted">Start your smarter study journey.</p><form class="form" onsubmit="signup(event)"><input class="input" id="name" placeholder="Full name" required><input class="input" id="email" type="email" placeholder="Email" required><input class="input" id="password" type="password" placeholder="Password" minlength="6" required><button class="btn orange" id="b">Create Account ✨</button><div id="msg"></div></form><p class="muted center">Already registered? <a href="/index.html" style="color:#7dbbff">Login</a></p></section></main><script>async function signup(e){e.preventDefault();b.disabled=true;b.textContent='Creating...';try{let r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,password:password.value})});let d=await r.json();msg.textContent=d.message;if(d.success){msg.style.color='#86efac';localStorage.setItem('gyamiUser',JSON.stringify(d.user));setTimeout(()=>location.href='/dashboard.html',500)}else{msg.style.color='#fca5a5';b.disabled=false;b.textContent='Create Account ✨'}}catch(x){msg.textContent='Could not connect to Gyami.';b.disabled=false;b.textContent='Create Account ✨'}}</script></body></html>
