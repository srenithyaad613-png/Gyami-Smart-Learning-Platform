<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gyami | Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<main class="auth">
    <section class="card authbox">

        <div class="logo">Gyami<span>✦</span></div>

        <h1>Welcome back</h1>
        <p class="muted">Your smart learning space is ready.</p>

        <form class="form" id="loginForm">

            <input
                class="input"
                id="email"
                type="email"
                placeholder="Email"
                required
            >

            <input
                class="input"
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <button class="btn" id="loginButton" type="submit">
                Login 🚀
            </button>

            <div id="loginMessage" class="small"></div>

        </form>

        <p class="muted center">
            New to Gyami?
            <a href="/signup.html" style="color:#7dbbff">
                Create an account
            </a>
        </p>

    </section>
</main>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const button = document.getElementById("loginButton");
    const message = document.getElementById("loginMessage");

    button.disabled = true;
    button.textContent = "Logging in...";
    message.textContent = "";

    try {

        const response = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (data.success) {

            localStorage.setItem(
                "gyamiUser",
                JSON.stringify(data.user)
            );

            message.style.color = "#86efac";
            message.textContent = "Login successful! Opening Gyami...";

            setTimeout(function() {
                window.location.href = "/dashboard.html";
            }, 500);

        } else {

            message.style.color = "#fca5a5";
            message.textContent = data.message || "Invalid email or password.";

            button.disabled = false;
            button.textContent = "Login 🚀";
        }

    } catch (error) {

        console.error(error);

        message.style.color = "#fca5a5";
        message.textContent = "Could not connect to Gyami backend.";

        button.disabled = false;
        button.textContent = "Login 🚀";
    }

});
</script>

</body>
</html>
